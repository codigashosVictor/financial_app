{% extends "base.html" %}
{% block title %}{{ "Editar" if debt else "Nueva" }} Deuda{% endblock %}

{% block content %}
<div class="px-4 pt-6 max-w-lg mx-auto">

  <div class="flex items-center gap-3 mb-6">
    <a href="/net-worth/" class="text-slate-500 hover:text-white transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <h2 class="text-xl font-bold text-white">
      {{ "Editar deuda" if debt else "Nueva deuda" }}
    </h2>
  </div>

  {% if error %}
  <div class="mb-4 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <label class="block text-xs font-medium text-slate-400 mb-2">Nombre de la deuda</label>
      <input type="text" name="name" required value="{{ debt.name if debt else '' }}"
        placeholder="Ej: Préstamo auto, Hipoteca casa..."
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500
                          focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <label class="block text-xs font-medium text-slate-400 mb-2">Tipo</label>
      <select name="type" required
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white
                          focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
        {% for t in debt_types %}
        <option value="{{ t }}" {{ "selected" if debt and debt.type==t else "" }}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>

    {% if not debt %}
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <label class="block text-xs font-medium text-slate-400 mb-2">
        Saldo actual <span class="text-slate-600">(opcional)</span>
      </label>
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm">$</span>
        <input type="number" name="balance" step="0.01" min="0" placeholder="0.00"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-8 pr-4 py-3 text-sm text-white placeholder-slate-500
                              focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
      </div>
    </div>
    {% endif %}

    <button type="submit"
      class="w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold py-3.5 rounded-xl transition">
      {{ "Guardar cambios" if debt else "Crear deuda" }}
    </button>
  </form>
</div>
{% endblock %}
